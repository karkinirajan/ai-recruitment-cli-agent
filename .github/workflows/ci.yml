name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest supported (pyproject "requires-python"); 3.14 is what .python-version pins.
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pipx install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Dependency audit
        if: matrix.python == '3.14'
        run: uv audit --preview-features audit-command
      - name: The package builds
        if: matrix.python == '3.14'
        run: uv build

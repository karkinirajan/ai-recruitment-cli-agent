[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-recruitment-agent"
version = "0.3.2"
description = "AI-powered CV screening CLI — ranks candidates against a Job Description using Google Gemini and pushes results to Notion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kneeraazon404" }]
keywords = ["recruitment", "cv", "screening", "gemini", "notion", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "typer",
    "rich",
    "python-dotenv",
    "google-genai",
    "notion-client",
    "pdfplumber",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
ai-recruit = "ai_recruitment_agent.main:app"

[project.urls]
Homepage = "https://github.com/kneeraazon404/ai-recruitment-cli-agent"
Repository = "https://github.com/kneeraazon404/ai-recruitment-cli-agent"
Issues = "https://github.com/kneeraazon404/ai-recruitment-cli-agent/issues"
Changelog = "https://github.com/kneeraazon404/ai-recruitment-cli-agent/releases"

[tool.hatch.build.targets.wheel]
packages = ["ai_recruitment_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/tests",
    "/cvs",
    "/jds",
    "/.env*",
    "/main.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["tests/mutation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
